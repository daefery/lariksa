<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body{width:1600px;height:780px;padding:60px 72px;background:var(--sage)}
h2{font-size:38px;letter-spacing:-1.3px;font-weight:800;margin-top:10px}
.lede{font-size:18px;color:var(--muted);margin-top:10px;max-width:1100px;line-height:1.55}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
figure{display:flex;flex-direction:column;gap:14px}
.crop{height:470px;overflow:hidden;border-radius:14px;box-shadow:0 24px 60px -18px rgba(23,36,30,.35),0 0 0 1px rgba(23,36,30,.08)}
.crop img{display:block;width:140.5%;margin-left:-31.6%;margin-top:-4%}
figcaption{display:flex;align-items:center;gap:12px;font-size:16px}
.said{font-family:"DM Mono",monospace;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--forest)}
.arrow{color:var(--focus);font-weight:700}
.lang{font-weight:700;background:var(--forest);color:var(--lime);border-radius:8px;padding:6px 10px;font-size:14px}
</style></head>
<body>
<div class="eyebrow">Language</div>
<h2>The notulen speaks the language of the meeting.</h2>
<p class="lede">Indonesian with English work terms stays Indonesian. An English meeting gets English notulen, headings included. Or pin one language in Settings.</p>
<div class="pair">
  <figure><div class="crop"><img src="../assets/screen-notulen.png"></div>
    <figcaption><span class="said">"Bug login Android masih ada, fix-nya Rabu."</span><span class="arrow">→</span><span class="lang">Notulen · ID</span></figcaption></figure>
  <figure><div class="crop"><img src="../assets/screen-notulen-en.png"></div>
    <figcaption><span class="said">"The fix should be done by Wednesday."</span><span class="arrow">→</span><span class="lang">Notulen · EN</span></figcaption></figure>
</div>
</body></html>
