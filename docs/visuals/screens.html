<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
body{width:1600px;height:1020px;padding:60px 72px}
h2{font-size:38px;letter-spacing:-1.3px;font-weight:800;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px 26px;margin-top:38px}
figure{display:flex;flex-direction:column;gap:12px}
figure img{width:100%;aspect-ratio:1180/780;object-fit:cover;object-position:top left}
figcaption{display:flex;gap:10px;align-items:baseline}
figcaption .n{font-family:"DM Mono",monospace;font-size:13px;color:var(--focus)}
figcaption b{font-size:17px}
figcaption span{font-size:14.5px;color:var(--muted)}
</style></head>
<body>
<div class="eyebrow">The app</div>
<h2>Six screens. That's the whole product.</h2>
<div class="grid">
  <figure><img class="shot" src="../assets/screen-setup.png"><figcaption><span class="n">01</span><div><b>One-time setup</b><br><span>Models download into the app folder, then it's offline.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-recording.png"><figcaption><span class="n">02</span><div><b>Recording</b><br><span>Two level meters: you and the meeting.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-processing.png"><figcaption><span class="n">03</span><div><b>Processing</b><br><span>Stage and progress while you move on.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-transcript.png"><figcaption><span class="n">04</span><div><b>Transcript</b><br><span>Who said what, with timestamps.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-settings.png"><figcaption><span class="n">05</span><div><b>Settings</b><br><span>Display language, meeting languages, glossary, downloads.</span></div></figcaption></figure>
  <figure><img class="shot" src="../assets/screen-dark.png"><figcaption><span class="n">06</span><div><b>Dark theme</b><br><span>Brand palette, light and dark.</span></div></figcaption></figure>
</div>
</body></html>
