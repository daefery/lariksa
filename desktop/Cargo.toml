[package]
name = "lariksa-desktop"
description = "Lariksa for Windows: the window, the recording pill and the shortcut"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lariksa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lariksa-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
