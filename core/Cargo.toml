[package]
name = "lariksa-core"
description = "Lariksa: recording, transcription, notulen and storage, without the window"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
log = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "mkv", "ogg", "vorbis", "flac", "wav", "pcm", "adpcm"] }
symphonia-adapter-opus-rs = "0.1"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
wasapi = "0.25"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
