[project]
name = "lariksa"
version = "0.1.0"
description = "Portable, local-first meeting notes for Windows: two-track recording, Indonesian-first transcription, notulen from a local LLM."
authors = [{ name = "Fery Yundara Putera" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2.1",
  # av 19 renamed open()'s keyword arguments and breaks faster-whisper 1.2.1's
  # decode_audio ("unexpected keyword argument 'metadata_errors'").
  "av>=14,<19",
  "httpx>=0.27",
  "python-docx>=1.1",
  "pywebview>=6.0; sys_platform == 'win32'",
  "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/daefery/lariksa"

[project.scripts]
lariksa = "lariksa.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pyinstaller>=6.10; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
